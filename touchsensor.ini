
const int Touch =4;

const int led=12;
int Touchval,Touchthre=50;
void setup() {
  
  Serial.begin(115200);
  pinMode(led,OUTPUT);
  delay(500);

}

void loop() {
  
  Touchval = touchRead(Touch);
  Serial.println(Touchval);
  if(Touchval<Touchthre){
    digitalWrite(led,HIGH);
  }
  else{digitalWrite(led,LOW);}
  delay(100);

}
